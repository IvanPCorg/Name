<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name - Магазин</title>
    <!-- Подключаем Supabase JS клиент -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Базовые стили тем */
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --accent-color: #2ea44f;
            --border-color: #333;
        }
        body.dark { --bg-color: #121212; --text-color: #ffffff; --card-bg: #1e1e1e; --border-color: #333; }
        body.grey { --bg-color: #22272e; --text-color: #adbac7; --card-bg: #2d333b; --border-color: #444c56; }
        body.light { --bg-color: #ffffff; --text-color: #24292e; --card-bg: #f6f8fa; --border-color: #e1e4e8; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .controls select {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .product-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .product-price { font-size: 15px; color: var(--accent-color); margin-bottom: 10px; }
        .btn-tg {
            background-color: #2481cc;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-tg:hover { background-color: #1d6fa5; }
    </style>
</head>
<body class="dark">

    <header>
        <h1>Name Store</h1>
        <div class="controls">
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark">Темна</option>
                <option value="grey">Сіра</option>
                <option value="light">Світла</option>
            </select>
        </div>
    </header>

    <main>
        <div id="productsContainer" class="products-grid">
            <p>Завантаження товарів...</p>
        </div>
    </main>

    <script>
        // НОВЫЕ КЛЮЧИ И URL СУПАБЕЙС
        const supabaseUrl = 'https://vvoksqrnlufjuzertrtc.supabase.co';
        const supabaseKey = 'sb_publishable_G8ZyWx6NlIuSpHYyNMWj9w_9akbGtdK';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // Смена тем
        function changeTheme(theme) {
            document.body.className = theme;
            localStorage.setItem('site_theme', theme);
        }

        // Загрузка сохраненной темы
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('site_theme') || 'dark';
            document.body.className = savedTheme;
            document.getElementById('themeSelect').value = savedTheme;
            loadProducts();
        });

        // Загрузка товаров из базы данных
        async function loadProducts() {
            const container = document.getElementById('productsContainer');
            
            const { data: products, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Помилка завантаження:', error);
                container.innerHTML = '<p>Помилка завантаження товарів.</p>';
                return;
            }

            if (!products || products.length === 0) {
                container.innerHTML = '<p>Товарів поки немає.</p>';
                return;
            }

            container.innerHTML = '';
            products.forEach(product => {
                // Обработка картинок (проверка на массив или строку)
                let imageUrl = 'https://via.placeholder.com/200';
                if (product.images) {
                    if (Array.isArray(product.images) && product.images.length > 0) {
                        imageUrl = product.images[0];
                    } else if (typeof product.images === 'string') {
                        try {
                            const parsed = JSON.parse(product.images);
                            if (Array.isArray(parsed) && parsed.length > 0) imageUrl = parsed[0];
                        } catch(e) { imageUrl = product.images; }
                    }
                }

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <img src="${imageUrl}" alt="${product.title || 'Товар'}">
                        <div class="product-title">${product.title || 'Без назви'}</div>
                        <div class="product-price">${product.price ? product.price + ' грн' : ''}</div>
                    </div>
                    <a href="${product.tg_link || '#'}" target="_blank" class="btn-tg">Замовити в Telegram</a>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
