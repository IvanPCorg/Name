<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель — Name Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        input, select, textarea { width: 100%; padding: 10px; background: #1e1e1e; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .sizes-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .size-btn { background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 10px; text-align: center; border-radius: 5px; cursor: pointer; user-select: none; }
        .size-btn.active { background: #28a745; border-color: #28a745; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Додати новий товар</h2>
    <form id="product-form">
        <div class="form-group">
            <label>Назва товару</label>
            <input type="text" id="title" required placeholder="Наприклад: кросівки Air Force">
        </div>
        <div class="form-group">
            <label>Артикул</label>
            <input type="text" id="article" required placeholder="Артикул товару">
        </div>
        <div class="form-group">
            <label>Ціна (грн)</label>
            <input type="number" id="price" required placeholder="Ціна">
        </div>
        <div class="form-group">
            <label>Категорія</label>
            <select id="category">
                <option value="Взуття">Взуття</option>
                <option value="Одяг">Одяг</option>
                <option value="Аксесуари">Аксесуари</option>
            </select>
        </div>
        <div class="form-group">
            <label>Виберіть доступні розміри</label>
            <div class="sizes-grid" id="sizes-container"></div>
        </div>
        <div class="form-group">
            <label>Вибрати фото з галереї (можна кілька)</label>
            <input type="file" id="images" multiple accept="image/*">
        </div>
        <div class="form-group">
            <label>Посилання для замовлення в Telegram</label>
            <input type="text" id="telegram" required placeholder="https://t.me/username/123">
        </div>
        <button type="submit">Зберегти товар</button>
    </form>
    <div id="status"></div>

    <script>
        const SUPABASE_URL = 'https://vvoksqrnlufjuzertrtc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2b2tzcXJubHVmanV6ZXJ0cnRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MjM3MDEsImV4cCI6MjEwNTI5OTcwMX0.0sj68zOmzWPHxo1ZEeQszREvCrIMl5kpoAG8fRyQYNQ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Генерация сетки размеров от 35 до 46.5
        const sizesList = [];
        for (let i = 35; i <= 46.5; i += 0.5) sizesList.push(i);
        
        const sizesContainer = document.getElementById('sizes-container');
        const selectedSizes = new Set();

        sizesList.forEach(size => {
            const btn = document.createElement('div');
            btn.className = 'size-btn';
            btn.textContent = size;
            btn.onclick = () => {
                if (selectedSizes.has(size)) {
                    selectedSizes.delete(size);
                    btn.classList.remove('active');
                } else {
                    selectedSizes.add(size);
                    btn.classList.add('active');
                }
            };
            sizesContainer.appendChild(btn);
        });

        document.getElementById('product-form').onsubmit = async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.style.color = '#fff';
            status.textContent = 'Збереження...';

            const title = document.getElementById('title').value;
            const article = document.getElementById('article').value;
            const price = parseFloat(document.getElementById('price').value);
            const category = document.getElementById('category').value;
            const telegram = document.getElementById('telegram').value;
            const files = document.getElementById('images').files;

            let imageUrls = [];

            try {
                for (let file of files) {
                    const fileName = `${Date.now()}_${file.name}`;
                    const { data, error } = await supabaseClient.storage
                        .from('products-images')
                        .upload(fileName, file);

                    if (error) throw error;

                    const { data: publicUrlData } = supabaseClient.storage
                        .from('products-images')
                        .getPublicUrl(fileName);

                    imageUrls.push(publicUrlData.publicUrl);
                }

                const { error: dbError } = await supabaseClient
                    .from('products')
                    .insert([{
                        title,
                        article,
                        price,
                        category,
                        sizes: Array.from(selectedSizes),
                        images: imageUrls,
                        telegram_link: telegram
                    }]);

                if (dbError) throw dbError;

                status.style.color = '#28a745';
                status.textContent = 'Товар успішно збережено!';
                document.getElementById('product-form').reset();
                selectedSizes.clear();
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            } catch (err) {
                console.error(err);
                status.style.color = '#dc3545';
                status.textContent = 'Помилка: ' + (err.message || 'Не вдалося зберегти');
            }
        };
    </script>
</body>
</html>
